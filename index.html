<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Report Maker Pro</title>

    <style>
        /* --- GLOBAL & SAFE AREA --- */
        html, body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #000; height: 100vh; width: 100vw; overflow: hidden; position: fixed; }
        .app-wrapper { display: flex; flex-direction: column; height: 100%; width: 100%; padding-top: env(safe-area-inset-top, 5px); padding-bottom: env(safe-area-inset-bottom, 10px); box-sizing: border-box; }
        .page { display: none; height: 100%; width: 100%; flex-direction: column; overflow: hidden; }
        .page.active { display: flex; }

        /* --- TITLE SCREEN --- */
        #page-title { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 100; justify-content: center; align-items: center; background-color: #338c31; background-image: url('https://allmodeai.github.io/Report-m-app-updates/title_bg.jpg'); background-size: cover; background-position: center center; background-repeat: no-repeat; }
        .launch-card { background: transparent; padding: 30px 20px; width: 88%; height: 85vh; text-align: center; position: relative; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
        .launch-card::before { content: ""; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); width: 250px; height: 250px; background-image: url("https://allmodeai.github.io/Report-m-app-updates/Report_makerAppicon.jpg"); background-repeat: no-repeat; background-size: contain; opacity: 0.12; pointer-events: none; z-index: 0; }
        .app-subtitle { position: absolute; top: calc(40% - 101px); left: 0; width: 100%; text-align: center; color: rgba(255, 255, 255, 0.9); font-weight: 900; font-size: 0.7rem; letter-spacing: 2.5px; text-transform: uppercase; text-shadow: 0px 2px 4px rgba(0,0,0,0.6); z-index: 2; margin: 0; }
        .title-btn-group { width: 100%; z-index: 2; position: relative; margin-top: auto; padding-bottom: 75px; }
        .btn-go-wrapper { width: 80%; margin: 0 auto 20px auto; border-radius: 50px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        @keyframes pulse-glow { 0% { box-shadow: inset 0 4px 6px rgba(255,255,255,0.4), inset 0 -4px 6px rgba(0,0,0,0.2), 0 0 5px 0px rgba(255, 255, 0, 0.5); } 50% { box-shadow: inset 0 4px 6px rgba(255,255,255,0.4), inset 0 -4px 6px rgba(0,0,0,0.2), 0 0 25px 5px rgba(255, 255, 0, 1); } 100% { box-shadow: inset 0 4px 6px rgba(255,255,255,0.4), inset 0 -4px 6px rgba(0,0,0,0.2), 0 0 5px 0px rgba(255, 255, 0, 0.5); } }
        .btn-go { width: 100%; padding: 16px 10px; background-color: #ff6600; background-image: linear-gradient(rgba(255,255,255,0.25) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.25) 1px, transparent 1px); background-size: 20px 20px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); border: 2px solid #ff9966; border-radius: 50px; font-weight: 900; font-size: 1.2rem; text-transform: uppercase; box-shadow: inset 0 4px 6px rgba(255,255,255,0.4), inset 0 -4px 6px rgba(0,0,0,0.2); transition: all 0.1s ease; display: block; box-sizing: border-box; text-align: center; pointer-events: none; animation: pulse-glow 3s infinite ease-in-out; }
        .btn-up-wrapper { width: 60px; height: 60px; margin: 0 auto; border-radius: 50%; cursor: pointer; position: relative; }
        .btn-up { width: 100%; height: 100%; background-color: #ffcc00; background-image: linear-gradient(rgba(0,0,0,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 16px 16px; color: #222; border: 1px solid #ffe680; border-radius: 50%; font-weight: 900; font-size: 0.65rem; text-transform: uppercase; box-shadow: inset 0 4px 6px rgba(255,255,255,0.6), inset 0 -4px 6px rgba(0,0,0,0.15); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .update-badge { position: absolute; top: -2px; right: -2px; width: 14px; height: 14px; background-color: #ff3b30; border: 2px solid #0066cc; border-radius: 50%; display: none; z-index: 10; animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { transform: scale(0.95); } 70% { transform: scale(1); } 100% { transform: scale(0.95); } }
        .launch-footer { position: absolute; bottom: calc(5px + env(safe-area-inset-bottom)); left: 0; width: 100%; text-align: center; color: #fff; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); }
        .developer-credit { font-size: 0.6rem; font-weight: 900; text-transform: uppercase; }
        .footer-links { font-size: 0.55rem; font-weight: 700; margin-top: 4px; }
        .footer-links span { margin: 0 8px; text-decoration: underline; cursor: pointer; color: #ffffff; }

        /* --- GRADING PAGE --- */
        .container { background: white; border-radius: 8px; display: flex; flex-direction: column; height: 100%; overflow: hidden; margin: 2px; }
        .header-section { padding: 4px; border-bottom: 1px solid #eee; }
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; padding: 0 4px; }
        .btn-menu { background: #004c99; color: white; border: none; padding: 5px 12px; border-radius: 6px; font-size: 0.65rem; font-weight: 900; }
        .grading-title { font-weight: 900; color: #0066cc; font-size: 0.8rem; text-transform: uppercase; }
        .header-toggle { background: #ff9800; border-radius: 20px; display: flex; padding: 2px; border: 1px solid #e68a00; }
        .header-toggle-btn { padding: 4px 12px; border: none; background: transparent; color: #fff; font-weight: 900; font-size: 0.6rem; border-radius: 15px; }
        .header-toggle-btn.active { background: #28a745; color: white; }
        .student-info { display: grid; grid-template-columns: 1.4fr 1fr; gap: 3px; padding: 4px; border: 1.5px solid #0066cc; border-radius: 6px; }
        .info-field { display: flex; flex-direction: column; border-bottom: 1px solid #ddd; }
        .info-field label { font-size: 0.65rem; font-weight: 900; color: #0066cc; }
        .info-field input, .select-trigger { border: none; background: transparent; font-size: 0.9rem; outline: none; font-weight: 900; }
        
        /* TABLE & COMPACT INPUTS */
        .table-container { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 4px; }
        .table-wrap { width: 100%; overflow: auto; border: 1.5px solid #0066cc; border-radius: 4px; }
        table { border-collapse: collapse; min-width: 850px; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 2px; text-align: center; }
        .subject-name { text-align: left; font-weight: 900; padding: 0 4px; width: 110px; }
        
        /* COMPACT DUAL INPUTS */
        .dual-box { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 1px; }
        .dual-inputs { display: flex; flex-direction: row; gap: 1px; justify-content: center; }
        .marks-input-mini { width: 18px; height: 16px; font-size: 9px; border: 1px solid #ccc; border-radius: 2px; text-align: center; font-weight: 900; padding: 0; }
        .dual-total { font-size: 9px; font-weight: 900; color: #004c99; background: #eef6ff; border: 1px solid #b3d4ff; border-radius: 2px; padding: 0; width: 38px; text-align: center; margin-top: 1px; }

        .footer-row { background: #cbdff2; font-weight: 900; }
        .dashboard-section { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; padding: 4px; }
        .stat-box { border: 1px solid #ddd; text-align: center; padding: 2px; border-radius: 4px; }
        .stat-label { font-size: 0.6rem; font-weight: 900; color: #0066cc; }
        .btn-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 4px; }
        .btn { padding: 10px 2px; border: none; border-radius: 7px; font-weight: 900; font-size: 0.72rem; color: white; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div id="page-title" class="page active">
        <div class="launch-card">
            <div class="app-subtitle">Automated Student Assessment <br> Protocol</div>
            <div class="title-btn-group">
                <div class="btn-go-wrapper" onclick="startApp(this.querySelector('.btn-go'))">
                    <div class="btn-go">Start Grading</div>
                </div>
                <div class="btn-up-wrapper" onclick="checkForUpdates()">
                    <div id="update-badge" class="update-badge"></div>
                    <div class="btn-up"><span>Update<br>App</span></div>
                </div>
            </div>
            <div class="launch-footer">
                <div class="developer-credit">Developed by CS Lab • v1.3.29</div>
                <div class="footer-links">
                    <span onclick="showPopup('This tool operates entirely offline.', false, null, '#0066cc', 'OK')">Privacy Policy</span> |
                    <span onclick="showPopup('For institutional use only.\n\nContact us: support@cslab.com', false, null, '#0066cc', 'Close')">Terms</span>
                </div>
            </div>
        </div>
    </div>

    <div id="page-grading" class="page">
        <div class="container">
            <div class="header-section">
                </div>
            <div class="table-container">
                <div class="table-wrap">
                    <table id="main-table">
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
            </div>
    </div>
</div>

<script>

</script>
</body>
</html>
